<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Flippin' Chaos — Breakfast Kitchen</title>

  <!-- PWA / installable -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ff8fb1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flippin' Chaos" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game" width="960" height="600"></canvas>

    <!-- HTML overlay screens (menu, level intro, game over) -->
    <div id="overlay" class="overlay">
      <!-- content injected by main.js -->
    </div>

    <button id="mute-btn" class="mute-btn" title="Mute / unmute">🔊</button>
  </div>

  <p class="hint">
    Click tickets to fire them &middot; click a sizzling griddle in the
    <b>golden zone</b> to flip &middot; click the matching topping to plate.
    Keys: <b>E</b> = Expedite, <b>S</b> = Sous Chef.
  </p>

  <!-- load order matters: plain scripts share the window.HK namespace -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/render.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/input.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
